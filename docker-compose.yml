version: '3.8'

services:
  msgateway:
    build:
      context: ./msgateway
      dockerfile: Dockerfile
    container_name: msgateway
    ports:
      - "8080:8080"
    volumes:
      - ~/.m2:/root/.m2
    depends_on:
      - rabbitmq
      - postgres
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydb
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: mypassword
    networks:
      - backend

  msprofile:
    build:
      context: ./msprofile
      dockerfile: Dockerfile
    container_name: msprofile
    ports:
      - "8081:8081"
    volumes:
      - ~/.m2:/root/.m2
    depends_on:
      - rabbitmq
      - postgres
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/mydb
      SPRING_R2DBC_USERNAME: myuser
      SPRING_R2DBC_PASSWORD: mypassword
    networks:
      - backend


  msaccount:
    build:
      context: ./msaccount
      dockerfile: Dockerfile
    container_name: msaccount
    ports:
      - "8082:8082"
    volumes:
      - ~/.m2:/root/.m2
    depends_on:
      - rabbitmq
      - postgres
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/mydb
      SPRING_R2DBC_USERNAME: myuser
      SPRING_R2DBC_PASSWORD: mypassword
    networks:
      - backend


  mspayment:
    build:
      context: ./mspayment
      dockerfile: Dockerfile
    container_name: mspayment
    ports:
      - "8083:8083"
    volumes:
      - ~/.m2:/root/.m2
    depends_on:
      - rabbitmq
      - postgres
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/mydb
      SPRING_R2DBC_USERNAME: myuser
      SPRING_R2DBC_PASSWORD: mypassword
    networks:
      - backend


  msevents:
    build:
      context: ./msevents
      dockerfile: Dockerfile
    container_name: msevents
    ports:
      - "8084:8084"
    volumes:
      - ~/.m2:/root/.m2
    depends_on:
      - rabbitmq
      - postgres
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/mydb
      SPRING_R2DBC_USERNAME: myuser
      SPRING_R2DBC_PASSWORD: mypassword
    networks:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - msgateway
      - msprofile
      - msaccount
      - mspayment
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    networks:
      - backend

  rabbitmq-init:
    image: curlimages/curl:7.88.1
    container_name: rabbitmq-init
    depends_on:
      - rabbitmq
    entrypoint: ["sh", "-c"]
    command: >
      "
      echo 'Waiting for RabbitMQ management API...';
      until curl -u user:password -s http://rabbitmq:15672/api/healthchecks/node | grep -q '\"status\":\"ok\"'; do
        echo 'RabbitMQ not ready yet...';
        sleep 3;
      done;
      echo 'RabbitMQ is ready. Creating exchange, queue, and binding...';

      curl -u user:password -H 'content-type:application/json' -XPUT http://rabbitmq:15672/api/exchanges/%2f/my-exchange -d '{\"type\":\"direct\",\"durable\":true}';
      curl -u user:password -H 'content-type:application/json' -XPUT http://rabbitmq:15672/api/queues/%2f/my-queue -d '{\"durable\":true}';
      curl -u user:password -H 'content-type:application/json' -XPOST http://rabbitmq:15672/api/bindings/%2f/e/my-exchange/q/my-queue -d '{\"routing_key\":\"my-routing-key\"}';
      "
    networks:
      - backend

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
  rabbitdata:
