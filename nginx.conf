worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    upstream msgateway {
        server msgateway:8080;
    }

    upstream msprofile {
        server msprofile:8081;
    }

    upstream msaccount {
        server msaccount:8082;
    }

    upstream mspayment {
        server mspayment:8083;
    }

    upstream msevents {
        server msevents:8084;
    }

    server {
        listen 80;

        location /gateway/ {
            proxy_pass http://msgateway/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            rewrite ^/gateway(/.*)$ $1 break;
        }

        location /profile/ {
            proxy_pass http://msprofile/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            rewrite ^/profile(/.*)$ $1 break;
        }

        location /profile/swagger-ui.html {
            proxy_pass http://msprofile/swagger-ui.html;
        }

        location /profile/v3/api-docs {
            proxy_pass http://msprofile/v3/api-docs;
        }

        location /account/ {
            proxy_pass http://msaccount/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            rewrite ^/account(/.*)$ $1 break;
        }

        location /account/swagger-ui.html {
            proxy_pass http://msaccount/swagger-ui.html;
        }

        location /account/v3/api-docs {
            proxy_pass http://msaccount/v3/api-docs;
        }

        location /payment/ {
            proxy_pass http://mspayment/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            rewrite ^/payment(/.*)$ $1 break;
        }

        location /payment/swagger-ui.html {
            proxy_pass http://mspayment/swagger-ui.html;
        }

        location /payment/v3/api-docs {
            proxy_pass http://mspayment/v3/api-docs;
        }

        location /events/ {
            proxy_pass http://msevents/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            rewrite ^/events(/.*)$ $1 break;
        }

        location /events/swagger-ui.html {
            proxy_pass http://msevents/swagger-ui.html;
        }

        location /events/v3/api-docs {
            proxy_pass http://msevents/v3/api-docs;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
