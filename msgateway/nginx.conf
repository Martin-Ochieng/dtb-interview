events {}

http {
    upstream springboot_app {
        server app:8080;  # Connects to Spring Boot container by service name
    }

    server {
        listen 80;

        location / {
            proxy_pass http://springboot_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
